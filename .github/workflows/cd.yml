# Livraison continue (CD) : publie l'image Docker dans GitHub Container Registry (GHCR).
name: CD

on:
  push:
    branches: [main]

jobs:
  # Job 1 : les tests
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -v

  # Job 2 : construction + publication, SEULEMENT si les tests réussissent
  publication:
    needs: tests                 # <- dépendance : pas de tests verts, pas d'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # nécessaire pour écrire dans GHCR

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # GHCR exige un nom en minuscules
      - name: Préparer le nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gestion-incidents" >> "$GITHUB_ENV"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # jeton fourni automatiquement par GitHub

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
